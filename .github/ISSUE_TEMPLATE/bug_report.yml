name: Bug report
description: Report a reproducible problem using synthetic or redacted information.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not paste SavedVariables, databases, credentials, private connection links, raw logs or account/machine paths.
        Use private vulnerability reporting for security issues: https://github.com/bkhouser/WoW4EMCP/security/advisories/new
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.2.0-beta.2"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows/Node versions, WoW client version, and reload/screen/both mode. No account identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic examples. What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Error category, relevant coverage/freshness state, and test results. Do not attach raw captures or logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, character/account identifiers, private links and local machine paths.
          required: true
